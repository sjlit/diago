name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Test (race)
        run: go test -race -count=1 -timeout 15m ./...

  apidiff:
    name: API diff
    runs-on: ubuntu-latest
    # Informational while the v2 API is being reshaped: prints the public API
    # diff against the base commit. Remove continue-on-error once the API is
    # frozen and every change should be deliberate.
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Compare public API with the base branch
        run: scripts/apidiff.sh "${{ github.event.pull_request.base.sha }}"

  opus-c:
    name: Build with_opus_c
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install libopus
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus-dev libopusfile-dev pkg-config

      - name: Vet (with_opus_c)
        run: go vet -tags with_opus_c ./...

      - name: Test audio (with_opus_c)
        run: go test -tags with_opus_c -count=1 -timeout 5m ./audio
