version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive

  settings:
    staticcheck:
      checks:
        # Style-only checks are waived: this codebase keeps legacy protocol
        # constants (ST1003), file-local receiver names (ST1016) and terse doc
        # comments (ST1020-ST1022). SA4023 is waived for readRTCP, which is
        # intentionally a loop-until-error function whose only exit is an error.
        - all
        - -QF1008
        - -SA4023
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    revive:
      rules:
        # Only the doc-comment rule: every exported identifier needs a comment
        # that starts with its name (stutter check disabled).
        - name: exported
          arguments:
            - disableStutteringCheck

  exclusions:
    rules:
      # errcheck noise in tests and examples is accepted (cleanup Close calls,
      # response helpers). Every other enabled linter still runs on them.
      - path: _test\.go
        linters:
          - errcheck
      - path: ^examples/
        linters:
          - errcheck
      # The exported-doc rule is enforced on the root diago package. The
      # lower-level packages still have undocumented exports; document them and
      # remove this exclusion.
      - path: ^(audio|media|testdata|examples)/
        linters:
          - revive
